site_name: Normativa LSPD
site_url: https://normativa-lspd-infinity-rp.github.io/normativa-lspd/

theme:
  name: material
  palette:
    # Modo oscuro activado por defecto
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

# Extensiones para habilitar los recuadros de colores y avisos
markdown_extensions:
  - admonition
  - pymdownx.details

# Estructura del menú lateral
nav:
  - 1. INTRODUCCIÓN:
      - 1.1 Misión y Lema: index.md
      - 1.2 Autoridad y Jurisdicción: introduccion/autoridad.md
  - 2. ORGANIZACIÓN INSTITUCIONAL:
      - 2.1 Artículos: organizacion/articulos.md
      - 2.2 Imagen Institucional: organizacion/imagen-institucional.md
