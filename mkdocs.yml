site_name: Normativa LSPD
site_url: https://normativa-lspd-infinity-rp.github.io/normativa-lspd/

theme:
  name: material
  palette:
    # Modo oscuro activado por defecto
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

# Extensiones para habilitar recuadros de colores, avisos y pestañas (tabs)
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Estructura del menú lateral
nav:
  - 1. INTRODUCCIÓN:
      - 1.1 Misión y Lema: index.md
      - 1.2 Autoridad y Jurisdicción: introduccion/autoridad.md
  - 2. ORGANIZACIÓN INSTITUCIONAL:
      - 2.1 Artículos: organizacion/articulos.md
      - 2.2 Imagen Institucional: organizacion/imagen-institucional.md
      - 2.3 Jerarquía: organizacion/jerarquia.md
      - 2.4 Remuneraciones y Beneficios: organizacion/remuneraciones.md
  - 3. EQUIPAMIENTO Y RECURSOS:
      - 3.1 Alertas - Defcon: equipamiento/alertas.md
      - 3.2 Props y Uso: equipamiento/props.md
  - 4. PROCEDIMIENTOS OPERATIVOS:
      - 4.2 Prisión y Carceleta: procedimientos/prision.md
      - 4.3 Búsqueda y Captura: procedimientos/busqueda-captura.md
  - 5. NORMAS DE PATRULLAJE:
      - 5.2 Patrullaje: patrullaje/patrullaje.md
      - 5.3 Llamados al 911: patrullaje/llamados-911.md
      - 5.4.1 Maniobras Vehiculares: patrullaje/maniobras-vehiculares.md
